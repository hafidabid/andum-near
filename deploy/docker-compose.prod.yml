# Production stack. Run via deploy/deploy.sh (it passes --env-file deploy/.env.production).
# Only the API is reachable from the host, and only on 127.0.0.1; nginx terminates TLS in front of it.
name: andum

x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: andum
      POSTGRES_DB: andum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/make-env.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U andum -d andum"], interval: 5s, retries: 20 }

  redis:
    image: redis:7
    restart: unless-stopped
    # BullMQ needs noeviction; AOF keeps queued relays across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  api:
    <<: *app
    build: { context: .., dockerfile: Dockerfile, target: api }
    image: andum-api:latest
    ports: ["127.0.0.1:${API_HOST_PORT:-8090}:8080"]
    environment: { PORT: "8080" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    build: { context: .., dockerfile: Dockerfile, target: worker }
    image: andum-worker:latest

volumes:
  pgdata:
  redisdata:
