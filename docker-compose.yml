# Local stack: Postgres 16, Redis 7, Mailpit, API and worker.  docker compose up --build
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: andum, POSTGRES_PASSWORD: andum, POSTGRES_DB: andum }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U andum"], interval: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  api:
    build: { context: ., dockerfile: Dockerfile, target: api }
    env_file: .env
    environment: { DATABASE_URL: "postgres://andum:andum@postgres:5432/andum", REDIS_URL: "redis://redis:6379", SMTP_URL: "smtp://mailpit:1025" }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8080:8080"]
  worker:
    build: { context: ., dockerfile: Dockerfile, target: worker }
    env_file: .env
    environment: { DATABASE_URL: "postgres://andum:andum@postgres:5432/andum", REDIS_URL: "redis://redis:6379", SMTP_URL: "smtp://mailpit:1025" }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
