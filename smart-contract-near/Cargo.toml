[workspace]
resolver = "2"
members = ["core", "mock-ft", "bridge", "integration"]

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
